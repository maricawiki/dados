name: Verificar SHA das Actions públicas
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validar_actions_sha.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/validar_actions_sha.py
