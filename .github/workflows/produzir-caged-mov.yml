name: Propor Novo Caged MOV municipal (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/produzir_caged_mov.py"
      - "scripts/test_produzir_caged_mov.py"
      - ".github/workflows/produzir-caged-mov.yml"
  workflow_dispatch:
  schedule:
    - cron: "13 12 10,28 * *"
permissions:
  contents: read
concurrency:
  group: caged-mov-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  caged:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/test_produzir_caged_mov.py
          python scripts/validar_lote_03.py
          command -v 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then args+=(--somente-revalidar); fi
          python -u scripts/produzir_caged_mov.py "${args[@]}" --propor "$RUNNER_TEMP/caged-mov"
          git diff --exit-code -- observatorio/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: caged-mov-proposta
          path: ${{ runner.temp }}/caged-mov/
          if-no-files-found: ignore
          retention-days: 7
