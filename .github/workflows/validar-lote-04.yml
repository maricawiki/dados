name: Validar lote 04 do Observatório
on:
  pull_request:
    paths:
      - 'observatorio/EDU-*'
      - 'observatorio/SAU-*'
      - 'observatorio/lote-04.manifest.json'
      - 'scripts/validar_lote_04.py'
      - '.github/workflows/validar-lote-04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/validar_lote_04.py
