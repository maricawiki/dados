name: Validar lote 06 do Observatório
on:
  pull_request:
    paths:
      - 'observatorio/SEG-*'
      - 'observatorio/FROTA-MARICA-ANUAL.*'
      - 'observatorio/lote-06.manifest.json'
      - 'scripts/validar_lote_06.py'
      - '.github/workflows/validar-lote-06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validar_lote_06.py
