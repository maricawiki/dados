name: Conferir fonte oficial SENATRAN (sem publicar)
on:
  workflow_dispatch:
    inputs:
      auditoria_completa:
        description: "Reconsultar todos os exercícios históricos"
        type: boolean
        default: false
  schedule:
    - cron: "19 11 12 2,3 *"
permissions:
  contents: read
concurrency:
  group: senatran-fonte-oficial
  cancel-in-progress: false
jobs:
  oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          command -v 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          python -m pip install --disable-pip-version-check xlrd==2.0.2
          args=()
          if [ "${{ inputs.auditoria_completa }}" = "true" ]; then args+=(--auditoria-completa); fi
          python -u scripts/produzir_senatran.py "${args[@]}" --propor "$RUNNER_TEMP/senatran"
          git diff --exit-code -- observatorio/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: senatran-proposta
          path: ${{ runner.temp }}/senatran/
          if-no-files-found: ignore
          retention-days: 7
