name: Validar produtor DCA SICONFI (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/produzir_dca.py"
      - "scripts/observatorio_financas_siconfi_sondar.py"
      - ".github/workflows/produzir-dca.yml"
      - "observatorio/FIN-0*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile scripts/produzir_dca.py
          python -u scripts/produzir_dca.py --propor "$RUNNER_TEMP/dca"
          git diff --exit-code -- observatorio/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: dca-proposta
          path: ${{ runner.temp }}/dca/
          if-no-files-found: ignore
          retention-days: 7
