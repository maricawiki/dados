name: Validar produtor RAIS vínculos (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/rais_vinculos_*.py"
      - "scripts/produzir_rais_vinculos.py"
      - "scripts/rais_estabelecimentos.py"
      - ".github/workflows/produzir-rais-vinculos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check duckdb==1.4.2
          python -m py_compile scripts/rais_vinculos_*.py scripts/rais_estabelecimentos.py scripts/produzir_rais_vinculos.py
          python scripts/validar_lote_03.py
          python -u scripts/produzir_rais_vinculos.py --propor "$RUNNER_TEMP/rais"
          git diff --exit-code -- observatorio/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: rais-proposta
          path: ${{ runner.temp }}/rais/
          retention-days: 7
          if-no-files-found: ignore
