name: Sondar PIB municipal (IBGE SIDRA 5938)
on:
  pull_request:
    paths:
      - scripts/observatorio_pib_sondar.py
      - .github/workflows/observatorio-pib-sondagem.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Consultar série PIB Maricá 2002–2023 do IBGE
        run: python scripts/observatorio_pib_sondar.py
