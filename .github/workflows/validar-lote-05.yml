name: Validar lote 05 do Observatório
on:
  pull_request:
    paths:
      - 'observatorio/SAN-*'
      - 'observatorio/MOB-*'
      - 'observatorio/TEL-*'
      - 'observatorio/TER-*'
      - 'observatorio/lote-05.manifest.json'
      - 'scripts/validar_lote_05.py'
      - '.github/workflows/validar-lote-05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validar_lote_05.py
