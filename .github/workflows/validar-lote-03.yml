name: Validar lote 03 do Observatório
on:
  pull_request:
    paths:
      - 'observatorio/ECO-*'
      - 'observatorio/TRB-*'
      - 'observatorio/lote-03.manifest.json'
      - 'scripts/validar_lote_03.py'
      - '.github/workflows/validar-lote-03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validar_lote_03.py
