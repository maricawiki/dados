name: Validar produtor SENATRAN e taxas ISP (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/produzir_senatran.py"
      - ".github/workflows/produzir-senatran.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile scripts/produzir_senatran.py
          python scripts/produzir_senatran.py --usar-cache
          git diff --exit-code -- observatorio/
  oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          command -v 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          python -m pip install --disable-pip-version-check xlrd==2.0.2
          python -u scripts/produzir_senatran.py --propor "$RUNNER_TEMP/senatran"
          git diff --exit-code -- observatorio/
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: senatran-proposta
          path: ${{ runner.temp }}/senatran/
          if-no-files-found: ignore
          retention-days: 7
