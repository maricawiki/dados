name: Validar produtor SENATRAN offline (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/produzir_senatran.py"
      - "scripts/senatran_mobilidade.py"
      - "scripts/test_senatran_mobilidade.py"
      - "scripts/test_produzir_senatran.py"
      - ".github/workflows/produzir-senatran.yml"
      - ".github/workflows/monitorar-senatran.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile scripts/produzir_senatran.py
          python scripts/test_produzir_senatran.py
          python scripts/test_senatran_mobilidade.py
          python scripts/produzir_senatran.py --usar-cache
          python scripts/validar_lote_06.py
          git diff --exit-code -- observatorio/
