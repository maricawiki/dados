name: Sondar saneamento censitário IBGE (leitura)
on:
  pull_request:
    paths:
      - "scripts/observatorio_saneamento_sondar.py"
      - ".github/workflows/observatorio-saneamento-sondagem.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Consultar tabulações oficiais do IBGE para Maricá
        run: python scripts/observatorio_saneamento_sondar.py
