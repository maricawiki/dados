name: Validar detalhes minimizados DAIR (sem publicar)
on:
  pull_request:
    paths:
      - "scripts/dair_minimizacao.py"
      - "scripts/produzir_dair_detalhes.py"
      - "scripts/validar_dair_detalhes.py"
      - "observatorio/PREV-005*"
      - ".github/workflows/validar-dair-detalhes.yml"
  workflow_dispatch:
  schedule:
    # Mesmo horário do monitor privado original; retirar o cron privado após o corte.
    - cron: '17 13 * * 3'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/validar_dair_detalhes.py
  oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile scripts/produzir_dair_detalhes.py
          python -u scripts/produzir_dair_detalhes.py
          git diff --exit-code -- observatorio/
